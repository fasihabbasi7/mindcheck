name: mind_check
description: "MindCheck - an offline self-reflection and personality assessment app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.2
  shared_preferences: ^2.5.6
  fl_chart: ^1.0.0
  hive_ce: ^2.0.0
  hive_ce_flutter: ^2.0.0
  pdf: ^3.11.0
  printing: ^5.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/questions/
    - assets/reports/
